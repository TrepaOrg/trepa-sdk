name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to release (e.g. 0.2.0). Must be greater than the current version.'
        required: true
        type: string
      schema_up_to_date:
        description: 'I regenerated `src/api/schema.ts` against the latest OpenAPI spec and committed it.'
        required: true
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Ensure release runs only on master
        run: |
          if [ "${{ github.ref_name }}" != "master" ]; then
            echo "::error::Releases can only be triggered from the master branch (got '${{ github.ref_name }}')."
            exit 1
          fi

      - name: Validate version input
        run: |
          if ! echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${{ inputs.version }}' is not a valid semver."
            exit 1
          fi

      - name: Confirm schema regeneration
        run: |
          if [ "${{ inputs.schema_up_to_date }}" != "true" ]; then
            echo "::error::Tick the 'schema_up_to_date' box before releasing. Run \`pnpm gen\` locally against the latest openapi.json, commit the resulting \`src/api/schema.ts\`, push, then re-run this workflow."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@trepa'

      - name: Ensure jq is available
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compare against current version
        id: compare
        run: |
          CURRENT=$(jq -r .version package.json)
          REQUESTED="${{ inputs.version }}"
          echo "Current: $CURRENT, requested: $REQUESTED"
          HIGHEST=$(printf '%s\n%s\n' "$CURRENT" "$REQUESTED" | sort -V | tail -n 1)
          if [ "$HIGHEST" != "$REQUESTED" ] || [ "$CURRENT" = "$REQUESTED" ]; then
            echo "::error::Requested version ($REQUESTED) must be strictly greater than current ($CURRENT)."
            exit 1
          fi
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Bump package.json to ${{ inputs.version }}
        run: |
          jq --arg v "${{ inputs.version }}" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "Bumped version: ${{ steps.compare.outputs.current }} -> ${{ inputs.version }}"

      - name: Build SDK (tsup)
        run: pnpm build

      - name: Verify pack contents
        run: |
          pnpm pack --pack-destination /tmp/pack
          ls -la /tmp/pack
          tar -tzf /tmp/pack/trepa-sdk-${{ inputs.version }}.tgz | sort

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --no-git-checks --access public --provenance

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(release): @trepa/sdk@${{ inputs.version }}"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Tag release
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
