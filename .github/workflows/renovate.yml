name: Renovate Pipeline

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass limits'
        type: boolean
        default: false
  schedule:
    - cron: '0 4 * * *' # Daily at 4am UTC

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: renovatebot/github-action@3064367f740a1a91cca218698a63902689cce200 # v46.1.20
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ github.event_name == 'workflow_dispatch' && 'debug' || 'info' }}
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_OSV_VULNERABILITY_ALERTS: 'true'
          RENOVATE_PR_HOURLY_LIMIT: ${{ inputs.force && '0' || '' }}
          RENOVATE_RECREATE_WHEN: ${{ inputs.force && 'always' || '' }}
